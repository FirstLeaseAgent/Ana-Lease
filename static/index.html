<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AnaLease · Solicitud</title><link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <header><div class="brand">Ana<span>Lease</span></div><p>Tu solicitud, paso a paso</p><button id="copy-conversation" type="button" style="padding:8px 12px;margin-top:8px">Copiar conversación</button></header>
    <section id="conversation" aria-live="polite"></section>
    <form id="composer"><label id="prompt" for="answer">Tu respuesta</label><div class="line"><input id="answer" autocomplete="off" required><button>Continuar</button></div></form>
    <p id="notice" role="status"></p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
